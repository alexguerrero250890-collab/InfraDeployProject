name: Deploy Infra + DB Bootstrap

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, staging, prod]

permissions:
  contents: read

concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  terraform_apply:
    name: Terraform Plan + Apply (guardrails)
    runs-on: self-hosted
    environment: ${{ inputs.environment }}

    env:
      TF_IN_AUTOMATION: "true"

    outputs:
      asg_name: ${{ steps.export_outputs.outputs.asg_name }}

    defaults:
      run:
        shell: bash
        working-directory: environments/${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Force clean workspace (self-hosted safety)
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard
          git clean -ffdx

      - name: Prepare Terraform temp + plugin cache (avoid /tmp issues)
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/tf-tmp" "${RUNNER_TEMP}/terraform-plugin-cache"
          chmod 700 "${RUNNER_TEMP}/tf-tmp" "${RUNNER_TEMP}/terraform-plugin-cache"
          echo "TMPDIR=${RUNNER_TEMP}/tf-tmp" >> "$GITHUB_ENV"
          echo "TF_PLUGIN_CACHE_DIR=${RUNNER_TEMP}/terraform-plugin-cache" >> "$GITHUB_ENV"

      - name: Ensure tools (jq)
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            if command -v yum >/dev/null 2>&1; then
              sudo yum -y install jq
            elif command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y jq
            fi
          fi
          command -v jq >/dev/null 2>&1 || { echo "jq is required"; exit 1; }

      - name: "Debug (runner): branch/SHA + env folder sanity"
        shell: bash
        run: |
          set -euo pipefail
          echo "GITHUB_REF=${GITHUB_REF}"
          echo "GITHUB_SHA=${GITHUB_SHA}"
          echo "git rev-parse HEAD:"
          git rev-parse HEAD

          echo
          echo "PWD=$(pwd)"
          echo "Expected to be in: environments/${{ inputs.environment }}"
          test -f main.tf || { echo "ERROR: main.tf not found. Wrong working-directory."; exit 1; }

          echo
          echo "Listing current env dir files:"
          ls -la

          echo
          echo "Autoscaling block in main.tf:"
          awk '
            /module "autoscaling"/ {show=1}
            show {print}
            show && /^\}/ {exit}
          ' main.tf || true

          echo
          echo "Any tfvars/auto.tfvars in this env dir?"
          ls -la *.tfvars *.auto.tfvars 2>/dev/null || true

          echo
          echo "Any TF_VAR_* overrides set?"
          env | grep -E "^TF_VAR_(min_size|desired_capacity|max_size)" || true

      - name: "Hard guard: forbid extra tfvars/auto.tfvars (prod-safe)"
        run: |
          set -euo pipefail

          # Permitimos SOLO terraform.tfvars (si existe).
          # Fallamos si existe cualquier *.auto.tfvars o cualquier *.tfvars distinto.
          autos="$(ls -1 *.auto.tfvars 2>/dev/null || true)"
          if [[ -n "${autos}" ]]; then
            echo "ERROR: Found *.auto.tfvars (these can override ASG capacity):"
            echo "${autos}"
            exit 1
          fi

          # tfvars distintos a terraform.tfvars
          others="$(ls -1 *.tfvars 2>/dev/null | grep -v '^terraform\.tfvars$' || true)"
          if [[ -n "${others}" ]]; then
            echo "ERROR: Found unexpected *.tfvars (only terraform.tfvars is allowed):"
            echo "${others}"
            exit 1
          fi

          echo "tfvars guard OK."

      - name: "Hard guard: main.tf must declare ASG capacity > 0"
        run: |
          set -euo pipefail
          # Esto evita ejecutar plan si el main.tf que se está usando tiene 0.
          if grep -nE 'min_size\s*=\s*0|desired_capacity\s*=\s*0' main.tf; then
            echo "ERROR: main.tf contains min_size=0 or desired_capacity=0 for this environment."
            echo "Aborting to prevent scale-to-zero."
            exit 1
          fi
          echo "main.tf guard OK (no scale-to-zero literals)."

      - name: Terraform Init
        run: |
          set -euo pipefail
          rm -rf .terraform .terraform.lock.hcl tfplan tfplan.json || true
          terraform init -input=false -upgrade

      - name: Terraform Validate
        run: |
          set -euo pipefail
          terraform validate

      - name: Terraform Plan
        run: |
          set -euo pipefail
          terraform plan -out=tfplan -input=false -lock-timeout=10m
          terraform show -json tfplan > tfplan.json

      - name: "Debug: show ASG diff from plan (module.autoscaling)"
        run: |
          set -euo pipefail
          echo "ASG diff from plan (module.autoscaling):"
          jq -r '
            .resource_changes[]
            | select(.type == "aws_autoscaling_group")
            | select(.address | test("module\\.autoscaling"))
            | select(.change.before != null and .change.after != null)
            | [
                " - " + .address,
                "    min_size: " + ((.change.before.min_size // null) | tostring) + " -> " + ((.change.after.min_size // null) | tostring),
                "    desired_capacity: " + ((.change.before.desired_capacity // null) | tostring) + " -> " + ((.change.after.desired_capacity // null) | tostring)
              ]
            | .[]
          ' tfplan.json || true

      - name: "Guardrail (prevent ASG scale-to-zero)"
        run: |
          set -euo pipefail

          echo "ASG changes (module.autoscaling only) from plan:"
          jq -r '
            .resource_changes[]
            | select(.type == "aws_autoscaling_group")
            | select(.address | test("module\\.autoscaling"))
            | select(.change.before != null and .change.after != null)
            | [
                " - " + .address,
                "    min_size: " + ((.change.before.min_size // null) | tostring) + " -> " + ((.change.after.min_size // null) | tostring),
                "    desired_capacity: " + ((.change.before.desired_capacity // null) | tostring) + " -> " + ((.change.after.desired_capacity // null) | tostring)
              ]
            | .[]
          ' tfplan.json || true

          if jq -e '
            .resource_changes[]
            | select(.type == "aws_autoscaling_group")
            | select(.address | test("module\\.autoscaling"))
            | select(.change.before != null and .change.after != null)
            | .change as $c
            | (
                (($c.before.min_size? // 0) > 0 and ($c.after.min_size? // 0) == 0)
                or
                (($c.before.desired_capacity? // 0) > 0 and ($c.after.desired_capacity? // 0) == 0)
              )
          ' tfplan.json > /dev/null; then
            echo
            echo "Guardrail triggered: module.autoscaling would scale ASG DOWN to 0. Aborting."
            echo "This indicates the runner is using unexpected overrides or wrong files."
            exit 1
          fi

          echo "Guardrail passed."

      - name: Terraform Apply (from plan)
        run: |
          set -euo pipefail
          terraform apply -auto-approve -input=false -lock-timeout=10m tfplan

      - name: Export outputs for downstream jobs
        id: export_outputs
        run: |
          set -euo pipefail
          ASG_NAME="$(terraform output -raw asg_name)"
          echo "asg_name=$ASG_NAME" >> "$GITHUB_OUTPUT"
          echo "ASG_NAME=$ASG_NAME"

  wait_for_instance:
    name: Wait for EC2 (from ASG)
    needs: terraform_apply
    runs-on: self-hosted
    environment: ${{ inputs.environment }}

    steps:
      - name: Wait until an instance is InService in the ASG
        shell: bash
        env:
          ASG_NAME: ${{ needs.terraform_apply.outputs.asg_name }}
        run: |
          set -euo pipefail
          [[ -n "${ASG_NAME:-}" ]] || { echo "ASG_NAME missing from terraform outputs"; exit 1; }

          echo "Waiting for InService instance in ASG: ${ASG_NAME}"
          for i in {1..60}; do
            INSTANCE_ID=$(aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names "$ASG_NAME" \
              --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId | [0]" \
              --output text)

            if [[ -n "$INSTANCE_ID" && "$INSTANCE_ID" != "None" ]]; then
              echo "Found InService instance: $INSTANCE_ID"
              exit 0
            fi
            sleep 10
          done

          echo "Timed out waiting for InService instances in ASG: ${ASG_NAME}"
          exit 1

  db_bootstrap:
    name: DB Bootstrap
    needs: wait_for_instance
    uses: ./.github/workflows/db-bootstrap.yml
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit
