name: DB Bootstrap

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (and GitHub Environment secrets scope)"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read

jobs:
  bootstrap:
    name: Bootstrap PostgreSQL
    runs-on: self-hosted
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Resolve EC2 instance dynamically
      # --------------------------------------------------
      - name: Resolve EC2 instance
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Environment,Values=${{ inputs.environment }}" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId | [0]" \
            --output text)

          if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "None" ]]; then
            echo "No running instance found for environment: ${{ inputs.environment }}"
            exit 1
          fi

          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"
          echo "Using instance: $INSTANCE_ID"

      # --------------------------------------------------
      # Start SSM tunnel (PROXY_ENDPOINT from Environment secrets)
      # --------------------------------------------------
      - name: Start SSM tunnel
        shell: bash
        env:
          PROXY_ENDPOINT: ${{ secrets.PROXY_ENDPOINT }}
        run: |
          set -euo pipefail

          echo "PROXY_ENDPOINT length: ${#PROXY_ENDPOINT}"
          [[ ${#PROXY_ENDPOINT} -gt 0 ]] || { echo "PROXY_ENDPOINT missing (Environment secret)"; exit 1; }

          aws ssm start-session \
            --target "$INSTANCE_ID" \
            --document-name AWS-StartPortForwardingSessionToRemoteHost \
            --parameters "host=${PROXY_ENDPOINT},portNumber=5432,localPortNumber=65432" \
            > ssm.log 2>&1 &

          SSM_PID=$!
          echo "SSM_PID=$SSM_PID" >> "$GITHUB_ENV"
          echo "Started SSM tunnel PID=$SSM_PID"

          echo "Waiting for tunnel..."
          for i in {1..30}; do
            nc -z 127.0.0.1 65432 && break
            sleep 1
          done

          nc -z 127.0.0.1 65432 || { echo "Tunnel failed"; tail -n 80 ssm.log; exit 1; }
          echo "Tunnel established."

      # --------------------------------------------------
      # Install Ansible collection
      # --------------------------------------------------
      - name: Install PostgreSQL collection
        shell: bash
        run: |
          set -euo pipefail
          ansible-galaxy collection install community.postgresql

      # --------------------------------------------------
      # Run Playbook
      # --------------------------------------------------
      - name: Run PostgreSQL bootstrap
        shell: bash
        env:
          DB_ADMIN_USER: ${{ secrets.DB_ADMIN_USER }}
          DB_ADMIN_PASSWORD: ${{ secrets.DB_ADMIN_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          APP_USER_PASSWORD: ${{ secrets.APP_USER_PASSWORD }}
        run: |
          set -euo pipefail

          PLAYBOOK="${GITHUB_WORKSPACE}/ansible/playbooks/postgres_bootstrap.yml"
          echo "Using playbook: $PLAYBOOK"
          test -f "$PLAYBOOK" || { echo "Playbook not found"; exit 1; }
          head -n 5 "$PLAYBOOK"

          ansible-playbook "$PLAYBOOK" \
            -e "db_host=127.0.0.1" \
            -e "db_port=65432" \
            -e "db_name=${DB_NAME}" \
            -e "db_admin_user=${DB_ADMIN_USER}" \
            -e "db_admin_password=${DB_ADMIN_PASSWORD}" \
            -e "enable_roles=true" \
            -e "pg_roles=[{'name':'app_user','password':'${APP_USER_PASSWORD}','flags':'LOGIN'}]"

      # --------------------------------------------------
      # Cleanup
      # --------------------------------------------------
      - name: Stop SSM tunnel
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${SSM_PID:-}" ]]; then
            echo "Stopping SSM tunnel PID=${SSM_PID}"
            kill "${SSM_PID}" >/dev/null 2>&1 || true
          else
            echo "SSM_PID not set; nothing to stop"
          fi
