name: DB Bootstrap

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read

jobs:
  bootstrap:
    name: Bootstrap PostgreSQL
    runs-on: self-hosted
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Ensure required tools exist on self-hosted runner
      # --------------------------------------------------
      - name: Ensure tools (aws, session-manager-plugin, ansible, jq, nc)
        shell: bash
        run: |
          set -euo pipefail

          command -v aws >/dev/null 2>&1 || { echo "aws cli not found"; exit 1; }

          # Best-effort installs (do not fail the job if install isn't possible)
          install_with_yum() { sudo yum -y install "$@" || true; }
          install_with_apt() { sudo apt-get update -y && sudo apt-get install -y "$@" || true; }

          if ! command -v session-manager-plugin >/dev/null 2>&1; then
            echo "session-manager-plugin not found. Attempting install..."
            if command -v yum >/dev/null 2>&1; then
              install_with_yum session-manager-plugin
            elif command -v apt-get >/dev/null 2>&1; then
              install_with_apt session-manager-plugin
            fi
          fi

          if ! command -v ansible-playbook >/dev/null 2>&1; then
            echo "ansible not found. Attempting install..."
            if command -v yum >/dev/null 2>&1; then
              install_with_yum ansible
            elif command -v apt-get >/dev/null 2>&1; then
              install_with_apt ansible
            fi
          fi

          if ! command -v jq >/dev/null 2>&1; then
            echo "jq not found. Attempting install..."
            if command -v yum >/dev/null 2>&1; then
              install_with_yum jq
            elif command -v apt-get >/dev/null 2>&1; then
              install_with_apt jq
            fi
          fi

          if ! command -v nc >/dev/null 2>&1; then
            echo "nc not found. Attempting install..."
            if command -v yum >/dev/null 2>&1; then
              install_with_yum nc
            elif command -v apt-get >/dev/null 2>&1; then
              install_with_apt netcat-openbsd
            fi
          fi

          # Final checks (fail if critical ones still missing)
          command -v session-manager-plugin >/dev/null 2>&1 || { echo "session-manager-plugin is required"; exit 1; }
          command -v ansible-playbook >/dev/null 2>&1 || { echo "ansible-playbook is required"; exit 1; }
          command -v nc >/dev/null 2>&1 || { echo "nc is required"; exit 1; }

      # --------------------------------------------------
      # Resolve EC2 instance dynamically by Environment tag
      # --------------------------------------------------
      - name: Resolve EC2 instance
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_ID="$(aws ec2 describe-instances \
            --filters "Name=tag:Environment,Values=${{ inputs.environment }}" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId | [0]" \
            --output text)"

          if [[ -z "${INSTANCE_ID}" || "${INSTANCE_ID}" == "None" ]]; then
            echo "No running instance found for environment: ${{ inputs.environment }}"
            exit 1
          fi

          echo "INSTANCE_ID=${INSTANCE_ID}" >> "$GITHUB_ENV"
          echo "Using instance: ${INSTANCE_ID}"

      # --------------------------------------------------
      # Start SSM tunnel to RDS Proxy (local 65432 -> remote 5432)
      # --------------------------------------------------
      - name: Start SSM tunnel
        id: tunnel
        shell: bash
        run: |
          set -euo pipefail

          LOCAL_PORT="65432"
          REMOTE_PORT="5432"

          # Guard: ensure PROXY_ENDPOINT secret is present
          if [[ -z "${{ secrets.PROXY_ENDPOINT }}" ]]; then
            echo "ERROR: PROXY_ENDPOINT secret is empty/missing for environment '${{ inputs.environment }}'"
            exit 1
          fi

          # Start port-forward session in background
          aws ssm start-session \
            --target "${{ env.INSTANCE_ID }}" \
            --document-name "AWS-StartPortForwardingSessionToRemoteHost" \
            --parameters "host=${{ secrets.PROXY_ENDPOINT }},portNumber=${REMOTE_PORT},localPortNumber=${LOCAL_PORT}" \
            > ssm.log 2>&1 &

          SSM_PID="$!"
          echo "SSM_PID=${SSM_PID}" >> "$GITHUB_ENV"
          echo "Started SSM tunnel PID=${SSM_PID}"

          # Wait until local port is listening
          for i in {1..30}; do
            if nc -z 127.0.0.1 "${LOCAL_PORT}" >/dev/null 2>&1; then
              echo "Tunnel is up on 127.0.0.1:${LOCAL_PORT}"
              exit 0
            fi
            sleep 1
          done

          echo "Tunnel did not come up in time. ssm.log:"
          tail -n 200 ssm.log || true
          exit 1

      # --------------------------------------------------
      # Install Ansible collection (safe to repeat)
      # --------------------------------------------------
      - name: Install PostgreSQL collection
        shell: bash
        run: |
          set -euo pipefail
          ansible-galaxy collection install community.postgresql

      # --------------------------------------------------
      # Execute Playbook
      # --------------------------------------------------
      - name: Run PostgreSQL bootstrap
        shell: bash
        env:
          DB_ADMIN_USER: ${{ secrets.DB_ADMIN_USER }}
          DB_ADMIN_PASSWORD: ${{ secrets.DB_ADMIN_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          APP_USER_PASSWORD: ${{ secrets.APP_USER_PASSWORD }}
        run: |
          set -euo pipefail

          ansible-playbook ansible/playbooks/postgres_bootstrap.yml \
            -e "db_host=127.0.0.1" \
            -e "db_port=65432" \
            -e "db_name=${DB_NAME}" \
            -e "db_admin_user=${DB_ADMIN_USER}" \
            -e "db_admin_password=${DB_ADMIN_PASSWORD}" \
            -e "enable_roles=true" \
            -e "pg_roles=[{'name':'app_user','password':'${APP_USER_PASSWORD}','flags':'LOGIN'}]"

      # --------------------------------------------------
      # Cleanup
      # --------------------------------------------------
      - name: Stop SSM tunnel
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${SSM_PID:-}" ]]; then
            echo "Stopping SSM tunnel PID=${SSM_PID}"
            kill "${SSM_PID}" >/dev/null 2>&1 || true
          else
            echo "SSM_PID not set; nothing to stop"
          fi
