name: DB Bootstrap

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions:
  contents: read

jobs:
  bootstrap:
    name: Bootstrap PostgreSQL
    runs-on: self-hosted
    environment: ${{ inputs.environment }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure tools (psql, nc, session-manager-plugin)
        shell: bash
        run: |
          set -euo pipefail

          install_with_yum() { sudo yum -y install "$@" || true; }
          install_with_apt() { sudo apt-get update -y && sudo apt-get install -y "$@" || true; }

          if ! command -v psql >/dev/null 2>&1; then
            if command -v yum >/dev/null 2>&1; then
              install_with_yum postgresql
            elif command -v apt-get >/dev/null 2>&1; then
              install_with_apt postgresql-client
            fi
          fi

          if ! command -v nc >/dev/null 2>&1; then
            if command -v yum >/dev/null 2>&1; then
              install_with_yum nmap-ncat
            elif command -v apt-get >/dev/null 2>&1; then
              install_with_apt netcat-openbsd
            fi
          fi

          if ! command -v session-manager-plugin >/dev/null 2>&1; then
            if command -v yum >/dev/null 2>&1; then
              install_with_yum session-manager-plugin
            elif command -v apt-get >/dev/null 2>&1; then
              install_with_apt session-manager-plugin
            fi
          fi

          command -v psql >/dev/null 2>&1 || { echo "psql is required"; exit 1; }
          command -v nc >/dev/null 2>&1 || { echo "nc is required"; exit 1; }
          command -v session-manager-plugin >/dev/null 2>&1 || { echo "session-manager-plugin is required"; exit 1; }

      - name: Load DB admin credentials from Secrets Manager (source of truth)
        shell: bash
        env:
          PROXY_SECRET_ARN: ${{ secrets.PROXY_SECRET_ARN }}
        run: |
          set -euo pipefail
          [[ -n "${PROXY_SECRET_ARN:-}" ]] || { echo "PROXY_SECRET_ARN missing (Environment secret)"; exit 1; }

          export SECRET_JSON="$(aws secretsmanager get-secret-value \
            --secret-id "$PROXY_SECRET_ARN" \
            --query SecretString \
            --output text)"

          DB_ADMIN_USER="$(python3 -c 'import json,os; print(json.loads(os.environ["SECRET_JSON"])["username"])')"
          DB_ADMIN_PASSWORD="$(python3 -c 'import json,os; print(json.loads(os.environ["SECRET_JSON"])["password"])')"

          {
            echo "DB_ADMIN_USER=$DB_ADMIN_USER"
            echo "DB_ADMIN_PASSWORD=$DB_ADMIN_PASSWORD"
          } >> "$GITHUB_ENV"

          echo "Loaded DB admin user from Secrets Manager: $DB_ADMIN_USER"
          echo "DB_ADMIN_PASSWORD length: ${#DB_ADMIN_PASSWORD}"
          echo -n "$DB_ADMIN_PASSWORD" | sha256sum | awk '{print "DB_ADMIN_PASSWORD sha256: "$1}'

      - name: Resolve EC2 instance (SSM target by Name tag)
        shell: bash
        env:
          SSM_TARGET_TAG_NAME: ${{ secrets.SSM_TARGET_TAG_NAME }}
        run: |
          set -euo pipefail
          [[ -n "${SSM_TARGET_TAG_NAME:-}" ]] || { echo "SSM_TARGET_TAG_NAME missing (Environment secret)"; exit 1; }

          INSTANCE_ID="$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${SSM_TARGET_TAG_NAME}" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId | [0]" \
            --output text)"

          if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "None" ]]; then
            echo "No running instance found with Name tag: ${SSM_TARGET_TAG_NAME}"
            aws ec2 describe-instances \
              --filters "Name=instance-state-name,Values=running" \
              --query "Reservations[].Instances[].{Id:InstanceId,Name:Tags[?Key=='Name']|[0].Value,Env:Tags[?Key=='Environment']|[0].Value}" \
              --output table || true
            exit 1
          fi

          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"
          echo "Using instance: $INSTANCE_ID"

      - name: Start SSM tunnel (local 65432 -> proxy 5432)
        shell: bash
        env:
          PROXY_ENDPOINT: ${{ secrets.PROXY_ENDPOINT }}
        run: |
          set -euo pipefail
          [[ -n "${PROXY_ENDPOINT:-}" ]] || { echo "PROXY_ENDPOINT missing (Environment secret)"; exit 1; }
          [[ -n "${INSTANCE_ID:-}" ]] || { echo "INSTANCE_ID not set"; exit 1; }

          cleanup() {
            if [[ -n "${SSM_PID:-}" ]]; then
              kill "${SSM_PID}" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          aws ssm start-session \
            --target "$INSTANCE_ID" \
            --document-name AWS-StartPortForwardingSessionToRemoteHost \
            --parameters "host=${PROXY_ENDPOINT},portNumber=5432,localPortNumber=65432" \
            > ssm.log 2>&1 &

          SSM_PID=$!
          echo "SSM_PID=$SSM_PID" >> "$GITHUB_ENV"

          for _ in {1..30}; do
            nc -z 127.0.0.1 65432 && break
            sleep 1
          done

          nc -z 127.0.0.1 65432 || { echo "Tunnel failed"; tail -n 120 ssm.log || true; exit 1; }
          echo "Tunnel established."

      - name: Install Ansible PostgreSQL collection
        shell: bash
        run: |
          set -euo pipefail
          ansible-galaxy collection install community.postgresql

      - name: Run PostgreSQL bootstrap
        shell: bash
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          APP_USER_PASSWORD: ${{ secrets.APP_USER_PASSWORD }}
        run: |
          set -euo pipefail

          echo "Environment input: ${{ inputs.environment }}"
          echo "DB_NAME=$DB_NAME"
          echo "DB_ADMIN_USER=$DB_ADMIN_USER"
          echo "DB_ADMIN_PASSWORD length: ${#DB_ADMIN_PASSWORD}"
          echo -n "$DB_ADMIN_PASSWORD" | sha256sum | awk '{print "DB_ADMIN_PASSWORD sha256: "$1}'

          PGPASSWORD="$DB_ADMIN_PASSWORD" psql \
            "host=127.0.0.1 port=65432 dbname=$DB_NAME user=$DB_ADMIN_USER sslmode=require" \
            -c "SELECT 1;"

          PLAYBOOK="${GITHUB_WORKSPACE}/ansible/playbooks/postgres_bootstrap.yml"
          test -f "$PLAYBOOK" || { echo "Playbook not found"; exit 1; }

          ansible-playbook "$PLAYBOOK" \
            -e "db_host=127.0.0.1" \
            -e "db_port=65432" \
            -e "db_name=${DB_NAME}" \
            -e "db_admin_user=${DB_ADMIN_USER}" \
            -e "db_admin_password=${DB_ADMIN_PASSWORD}" \
            -e "enable_roles=true" \
            -e "pg_roles=[{'name':'app_user','password':'${APP_USER_PASSWORD}','flags':'LOGIN'}]"

      - name: Stop SSM tunnel
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${SSM_PID:-}" ]]; then
            kill "${SSM_PID}" >/dev/null 2>&1 || true
          fi
