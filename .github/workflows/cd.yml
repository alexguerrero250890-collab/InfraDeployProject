name: InfraDeploy CD (Manual Apply)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Elige el environment"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read

env:
  AWS_REGION: eu-north-1

jobs:
  apply:
    name: Terraform Apply (${{ inputs.environment }})
    runs-on: ubuntu-latest

    # Esto activa approvals si configuras GitHub Environments (Settings → Environments)
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform init
        run: terraform -chdir=environments/${{ inputs.environment }} init

      - name: Terraform apply
        run: terraform -chdir=environments/${{ inputs.environment }} apply -auto-approve

