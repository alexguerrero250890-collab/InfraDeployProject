name: InfraDeploy CD (Manual Apply)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Elige el environment"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read

env:
  AWS_REGION: eu-north-1
  TF_STATE_BUCKET: terraform-state-infradeploy
  TF_LOCK_TABLE: terraform-locks

jobs:
  apply:
    name: Terraform Apply (${{ inputs.environment }})
    runs-on: ubuntu-latest

    # Activa GitHub Environments (y sus protection rules si aplican)
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Who am I (AWS)
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          aws configure list

      - name: Backend access check (S3 + DynamoDB)
        run: |
          set -euo pipefail
          echo "Checking state object:"
          aws s3 ls "s3://${TF_STATE_BUCKET}/${{ inputs.environment }}/terraform.tfstate"
          echo "Checking lock table:"
          aws dynamodb describe-table --table-name "${TF_LOCK_TABLE}" --region "${AWS_REGION}" >/dev/null
          echo "Backend access OK."

      - name: Terraform init (reconfigure)
        run: |
          set -euo pipefail
          terraform -chdir=environments/${{ inputs.environment }} init -reconfigure

      - name: Terraform plan
        run: |
          set -euo pipefail
          terraform -chdir=environments/${{ inputs.environment }} plan -no-color

      - name: Terraform apply (auto-approve)
        run: |
          set -euo pipefail
          terraform -chdir=environments/${{ inputs.environment }} apply -auto-approve

