- name: Bootstrap PostgreSQL (database/extensions/schemas/privileges)
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    db_default_db: "postgres"

  pre_tasks:
    - name: Assert required connection vars exist
      ansible.builtin.assert:
        that:
          - db_host is defined
          - db_admin_user is defined
          - db_admin_password is defined
          - db_name is defined
        fail_msg: >
          Missing required variables. Define db_host, db_admin_user,
          db_admin_password and db_name.

    - name: Ensure psycopg2 is present
      ansible.builtin.pip:
        name: psycopg2-binary
        state: present

    - name: Connectivity check (SELECT 1)
      community.postgresql.postgresql_query:
        login_host: "{{ db_host }}"
        login_user: "{{ db_admin_user }}"
        login_password: "{{ db_admin_password }}"
        port: "{{ db_port | default(5432) }}"
        ssl_mode: "{{ db_ssl_mode | default('require') }}"
        db: "{{ db_default_db }}"
        query: "SELECT 1;"
      register: connectivity_check

    - name: Show connectivity result
      ansible.builtin.debug:
        msg: "DB connectivity OK"

  tasks:
    - name: Create roles/users (optional)
      community.postgresql.postgresql_user:
        login_host: "{{ db_host }}"
        login_user: "{{ db_admin_user }}"
        login_password: "{{ db_admin_password }}"
        port: "{{ db_port | default(5432) }}"
        ssl_mode: "{{ db_ssl_mode | default('require') }}"
        db: "{{ db_default_db }}"
        name: "{{ item.name }}"
        password: "{{ item.password | default(omit) }}"
        role_attr_flags: "{{ item.flags | default(omit) }}"
        state: present
      loop: "{{ pg_roles | default([]) }}"
      no_log: true
      when:
        - enable_roles | default(false) | bool
        - pg_roles is defined
        - pg_roles | length > 0

    - name: Create database
      community.postgresql.postgresql_db:
        login_host: "{{ db_host }}"
        login_user: "{{ db_admin_user }}"
        login_password: "{{ db_admin_password }}"
        port: "{{ db_port | default(5432) }}"
        ssl_mode: "{{ db_ssl_mode | default('require') }}"
        name: "{{ db_name }}"
        owner: "{{ db_owner | default(db_admin_user) }}"
        state: present

    - name: Ensure extensions installed
      community.postgresql.postgresql_ext:
        login_host: "{{ db_host }}"
        login_user: "{{ db_admin_user }}"
        login_password: "{{ db_admin_password }}"
        port: "{{ db_port | default(5432) }}"
        ssl_mode: "{{ db_ssl_mode | default('require') }}"
        db: "{{ db_name }}"
        name: "{{ item }}"
        state: present
      loop: "{{ pg_extensions | default([]) }}"
      when:
        - pg_extensions is defined
        - pg_extensions | length > 0

    - name: Create schemas
      community.postgresql.postgresql_schema:
        login_host: "{{ db_host }}"
        login_user: "{{ db_admin_user }}"
        login_password: "{{ db_admin_password }}"
        port: "{{ db_port | default(5432) }}"
        ssl_mode: "{{ db_ssl_mode | default('require') }}"
        db: "{{ db_name }}"
        name: "{{ item.name }}"
        owner: "{{ item.owner | default(db_admin_user) }}"
        state: present
      loop: "{{ pg_schemas | default([]) }}"
      when:
        - pg_schemas is defined
        - pg_schemas | length > 0

    - name: Grant privileges (optional)
      community.postgresql.postgresql_privs:
        login_host: "{{ db_host }}"
        login_user: "{{ db_admin_user }}"
        login_password: "{{ db_admin_password }}"
        port: "{{ db_port | default(5432) }}"
        ssl_mode: "{{ db_ssl_mode | default('require') }}"
        db: "{{ db_name }}"
        type: "{{ item.type }}"
        privs: "{{ item.privs }}"
        objs: "{{ item.objs }}"
        roles: "{{ item.roles }}"
        schema: "{{ item.schema | default(omit) }}"
        state: present
      loop: "{{ pg_privs | default([]) }}"
      when:
        - pg_privs is defined
        - pg_privs | length > 0
